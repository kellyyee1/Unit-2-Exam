<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Essay Builder</title>
    <style>
        body { font-family: Georgia, serif; max-width: 700px; margin: 60px auto; background: #f9f6f1; color: #222; }
        h1 { font-size: 1.8rem; border-bottom: 2px solid #333; padding-bottom: 8px; }
        fieldset { border: 1px solid #aaa; border-radius: 6px; padding: 16px; margin-bottom: 20px; }
        legend { font-weight: bold; font-size: 1rem; }
        textarea { display: block; margin: 8px 0; font-family: Georgia, serif; font-size: 1rem; width: 100%; box-sizing: border-box; border: 1px solid #aaa; border-radius: 4px; padding: 8px; resize: vertical; }
        button { padding: 10px 24px; font-size: 1rem; background: #333; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #555; }
        #essay_body { border: 1px solid #ccc; border-radius: 6px; background: #fff; min-height: 100px; padding: 16px 20px; }
        #essay_body p { margin: 0 0 1em 0; line-height: 1.6; }
        #essay_body:empty::before { content: "Your essay will appear here..."; color: #aaa; font-style: italic; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 7px 18px; background: #555; color: #fff; text-decoration: none; border-radius: 4px; font-size: 0.9rem; }
        .back-btn:hover { background: #333; }
    </style>
</head>
<body>
    <a class="back-btn" href="index.html">← Back</a>
    <h1>Essay Builder</h1>

    <fieldset>
        <legend>Add a Paragraph</legend>
        Text to insert:<br />
        <textarea id="paragraph" rows="10" cols="50" placeholder="Type your paragraph here..."></textarea>
        <button id="add">Add</button>
    </fieldset>

    <h2>Essay</h2>
    <div id="essay_body"></div>

    <script src="essay.js"></script>
</body>
</html>
