<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coin Flip</title>
    <style>
        body { font-family: Georgia, serif; max-width: 400px; margin: 60px auto; background: #f9f6f1; color: #222; text-align: center; }
        h1 { font-size: 1.8rem; border-bottom: 2px solid #333; padding-bottom: 8px; }
        #coin { width: 150px; height: 150px; margin: 20px auto; display: block; border-radius: 50%; border: 3px solid #aaa; }
        button { padding: 10px 28px; font-size: 1.1rem; background: #333; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #555; }
        .stats { margin-top: 20px; font-size: 1rem; }
        .stats span { font-weight: bold; font-size: 1.2rem; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 7px 18px; background: #555; color: #fff; text-decoration: none; border-radius: 4px; font-size: 0.9rem; }
        .back-btn:hover { background: #333; }
    </style>
</head>
<body>
    <a class="back-btn" href="index.html">← Back</a>
    <h1>Coin Flip</h1>
    <img id="coin" src="heads.jpg" alt="coin" />
    <br />
    <button id="flip">Flip!</button>
    <div class="stats">
        Heads: <span id="num_heads">0</span> &nbsp;|&nbsp;
        Tails: <span id="num_tails">0</span>
    </div>

    <script src="coinflip.js"></script>
</body>
</html>
